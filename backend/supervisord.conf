[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:web]
command=/app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/python -m celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
