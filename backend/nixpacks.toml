[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = [
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  "/root/.local/bin/uv venv /app/.venv",
  "/root/.local/bin/uv pip install -r requirements.txt --python /app/.venv/bin/python"
]

[start]
cmd = "/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
